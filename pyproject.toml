[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equation-extraction-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  # PDF reading and rendering
  "pypdfium2>=4.30.0",
  "pdfminer.six>=20231228",
  "pdfplumber>=0.11.0",
  # Image processing
  "opencv-contrib-python-headless>=4.9.0",
  "numpy>=1.26.0",
  "Pillow>=10.3.0",
  # Equation extraction / OCR
  "latex2mathml>=3.76.0",
  "httpx>=0.27.0",
  "tenacity>=8.2.0",
  # Layout analysis
  "docling>=2.0.0",
  "onnxruntime>=1.17.0",
  # Pipeline infrastructure
  "python-dotenv>=1.0.0",
  "structlog>=24.0.0",
  "pyyaml>=6.0.1",
  "click>=8.1.7",
  "rich>=13.7.0",
  "tqdm>=4.66.0",
  "truststore>=0.9.0",
  # Serialisation
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.scripts]
equation-pipeline = "equation_extraction_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "outputs", "others", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "(^|/)(data|outputs|others|build|dist)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
